
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A Python Flask customer support chatbot demo.">
    <title>CodeAlpha Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="chat-container">
        <header class="chat-header">
            <div class="avatar" aria-hidden="true">AI</div>
            <div>
                <h1>CodeAlpha Assistant</h1>
                <p><span class="status"></span> FAQ Support Assistant</p>
            </div>
        </header>

        <section
            id="chat-box"
            class="chat-box"
            aria-label="Chat messages"
            aria-live="polite"
        >
            <div class="message bot">
                Hello! Welcome to CodeAlpha Assistant.
                Ask me about services, prices, refunds, payments or support hours.
            </div>
        </section>

        <form id="chat-form" class="chat-form">
            <label class="sr-only" for="user-input">Your message</label>
            <input
                type="text"
                id="user-input"
                placeholder="Type your message..."
                autocomplete="off"
                maxlength="1000"
                required
            >
            <button type="submit" id="send-button">Send ➤</button>
        </form>

        <footer>Built with Python and Flask</footer>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
